name: Check prices

on:
  schedule:
    # 8am and 8pm Eastern. GitHub runs on UTC, so 12:00 and 00:00.
    - cron: "0 12,0 * * *"
  workflow_dispatch:        # gives you a "Run now" button

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install requests beautifulsoup4

      - name: Check prices
        run: python tracker.py

      - name: Save today's prices
        run: |
          git config user.name "price-tracker"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Prices for $(date -u +%Y-%m-%d\ %H:%M) UTC"
          git push

      - name: Send alerts
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const alerts = JSON.parse(fs.readFileSync('data/alerts.json', 'utf8'));
            if (!alerts.length) return;

            const money = n => '$' + Number(n).toLocaleString('en-CA', {minimumFractionDigits: 2});
            const targets = alerts.filter(a => a.kind === 'target');
            const drops   = alerts.filter(a => a.kind === 'drop');

            let title, body = '';
            if (targets.length) {
              const t = targets[0];
              title = `Target hit: ${t.product} at ${money(t.price)} (${t.retailer})`;
              body += `**${t.product}** reached your target of ${money(t.target)}.\n\n`;
              for (const a of targets) {
                body += `- ${a.retailer}: **${money(a.price)}** — [buy](${a.url})\n`;
              }
              body += '\n';
            } else {
              const d = drops[0];
              title = `Price drop: ${d.product} down to ${money(d.price)} (${d.retailer})`;
            }

            if (drops.length) {
              body += `### Drops since last check\n\n`;
              for (const a of drops) {
                body += `- **${a.retailer}** ${money(a.was)} → **${money(a.price)}** `
                     +  `(${a.change.toFixed(2)}) — [view](${a.url})\n`;
              }
            }
            body += `\n_Close this issue once you've looked. A new one opens on the next drop._`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['price-alert']
            });
